server:
  port: 8080

spring:

  datasource:
    url: jdbc:mysql://localhost:3306/appdb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: appuser
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  batch:
    job:
      enabled: true
      # Spring Boot 3+ 에서는 Job 이 여러 개일 경우 실행할 Job 이름을 반드시 지정해야 한다.
      # 실행 예) ./gradlew bootRun --args='--job.name=jpaJob'
      name: ${job.name:singleStepJob}
    jdbc:
      # 배치 메타 테이블은 init.sql 로 생성한다.
      initialize-schema: never

  jpa:
    # Hibernate 6+ 는 Dialect 를 JDBC 메타데이터로 자동 감지하므로 database-platform 설정이 필요 없다.
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update

logging:
  level:
    org:
      hibernate: info
